substitutions:
  name: solax-meter-gateway
  device_description: "Control the export of a Solax X1 mini via RS485"
  external_components_source: github://syssi/esphome-modbus-solax-x1@main
  instantaneous_power_topic: "stat/EZ3/P_Wirk_L1"
  tx_pin: GPIO4
  rx_pin: GPIO5

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-solax-x1-mini"
    version: 2.7.0

esp8266:
  board: d1_mini

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client

uart:
  id: uart_0
  baud_rate: 9600
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  debug:
    direction: BOTH

solax_meter_modbus:
  - id: modbus0
    uart_id: uart_0
#    flow_control_pin: GPIO0

solax_meter_gateway:
  solax_meter_modbus_id: modbus0
  address: 0x01

  # The state of this sensor (instantaneous power in watt) is used as source
  power_id: powermeter0
  power_sensor_inactivity_timeout: 5s
  update_interval: 5s

  # Meter type returned during the RS485 handshake (register 0x0B).
  # Some inverters validate this value and keep repeating the handshake until
  # the smart meter responds with a supported type. Progress past the handshake
  # is impossible with a wrong value. After every 6 consecutive unaccepted
  # handshakes an error is logged suggesting to try a different value.
  # Known working values:
  #   0x0000 - Solax X1 mini
  #   0x00A6 - Solax X1 Hybrid Gen2+, SK-SU3700E (DDSU666 meter identity)
  #   0x00A8 - Solax X3 MIC Gen1, X3 G2/MIC (SDM230 meter identity)
  meter_type: 0x0000

sensor:
  - id: powermeter0
    internal: true
    platform: mqtt_subscribe
    name: "instantaneous power consumption"
    topic: "${instantaneous_power_topic}"
    accuracy_decimals: 2
    unit_of_measurement: W
    device_class: power

  - platform: solax_meter_gateway
    power_demand:
      name: "power demand"

text_sensor:
  - platform: solax_meter_gateway
    operation_mode:
      name: "operation mode"

switch:
  - platform: solax_meter_gateway
    manual_mode:
      name: "manual mode"
      restore_mode: RESTORE_DEFAULT_OFF
    emergency_power_off:
      name: "emergency power off"
      restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: solax_meter_gateway
    manual_power_demand:
      name: "manual power demand"
