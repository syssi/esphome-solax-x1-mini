substitutions:
  name: solax-x1-mini
  device_description: "Monitor multiple Solax X1 mini via RS485"
  external_components_source: github://syssi/esphome-solax-x1-mini@main
  device0: firstfloor-x1-mini
  device1: groundfloor-x1-mini
  device2: community-x1-mini

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-solax-x1-mini"
    version: 2.7.0
  devices:
    - id: device0
      name: "${device0}"
    - id: device1
      name: "${device1}"
    - id: device2
      name: "${device2}"

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0

ota:
  platform: esphome

logger:
  baud_rate: 0
  level: DEBUG

# If you use Home Assistant please remove this `mqtt` section and uncomment the `api` component!
# The native API has many advantages over MQTT: https://esphome.io/components/api.html#advantages-over-mqtt
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client

# api:

uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: GPIO1
    rx_pin: GPIO3
  - id: uart_1
    baud_rate: 9600
    tx_pin: GPIO14
    rx_pin: GPIO4
  - id: uart_2
    baud_rate: 9600
    tx_pin: GPIO32
    rx_pin: GPIO33

solax_modbus:
  - id: modbus0
    uart_id: uart_0
  - id: modbus1
    uart_id: uart_1
  - id: modbus2
    uart_id: uart_2

solax_x1_mini:
  - id: solax0
    solax_modbus_id: modbus0
    update_interval: 2s
  - id: solax1
    solax_modbus_id: modbus1
    update_interval: 2s
  - id: solax2
    solax_modbus_id: modbus2
    update_interval: 2s

text_sensor:
